name: Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check for Cloudflare credentials
        id: cf
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - run: npm ci
        if: steps.cf.outputs.ready == 'true'
      - name: Deploy to Cloudflare
        if: steps.cf.outputs.ready == 'true'
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log || { grep -iE "error|✘|code:|failed|denied|permission" deploy.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
